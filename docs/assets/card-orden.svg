<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 196" width="420" height="196" role="img" aria-label="ORDEN: Public-sector ERP: Optimizador de Recursos para Departamentos y Entidades Nacionales. (En Desarrollo)">
  <title>ORDEN</title>
  <style>
    .corre{animation:corre 7s linear infinite;animation-delay:-2.6s}
    @keyframes corre{to{stroke-dashoffset:-1000}}
    .brillo{animation:brillo 7s ease-in-out infinite;animation-delay:4.2s}
    @keyframes brillo{0%{transform:translateX(0)}40%,100%{transform:translateX(680px)}}
    .anillo{transform-box:fill-box;transform-origin:center;animation:anillo 2s ease-out infinite}
    @keyframes anillo{0%{transform:scale(1);opacity:.9}100%{transform:scale(3.2);opacity:0}}
    .tipo{animation:tipo 5s steps(15) infinite}
    @keyframes tipo{0%,50%{width:150px}62%{width:0}90%,100%{width:150px}}
    .cursor{animation:cursor 5s steps(15) infinite}
    @keyframes cursor{0%,50%{transform:translateX(136px)}62%{transform:translateX(0)}90%,100%{transform:translateX(136px)}}
    .parpadeo{animation:parpadeo 1s steps(1) infinite}
    @keyframes parpadeo{50%{opacity:0}}
    .marcha{animation:marcha 1s linear infinite}
    @keyframes marcha{to{transform:translateX(24px)}}
    .pasa{animation:pasa 3s linear infinite}
    @keyframes pasa{0%{transform:translateX(0) skewX(-20deg)}100%{transform:translateX(500px) skewX(-20deg)}}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
  <defs>
    <clipPath id="marco"><rect x="1" y="1" width="418" height="194" rx="12"/></clipPath>
    <linearGradient id="luz" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".07"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <linearGradient id="lleno" x1="0" x2="1"><stop offset="0" stop-color="#8be9fd"/><stop offset="1" stop-color="#bd93f9"/></linearGradient>
  </defs>
  <g>
    <rect x="1" y="1" width="418" height="194" rx="12" fill="#282a36" stroke="#44475a" stroke-width="1.5"/>
    <rect x="1" y="1" width="418" height="30" rx="12" fill="#1e1f29"/>
    <rect x="1" y="20" width="418" height="11" fill="#1e1f29"/>
