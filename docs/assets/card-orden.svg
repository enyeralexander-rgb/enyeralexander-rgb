    <text x="24" y="96" font-family='-apple-system,"Segoe UI",Helvetica,Arial,sans-serif' font-size="14.5" fill="#d6d8e8">Public-sector ERP: Optimizador de Recursos</text><text x="24" y="116" font-family='-apple-system,"Segoe UI",Helvetica,Arial,sans-serif' font-size="14.5" fill="#d6d8e8">para Departamentos y Entidades Nacionales.</text>
    <rect x="24.0" y="128" width="69.0" height="22" rx="11" fill="#44475a"/><text x="58.5" y="143" text-anchor="middle" font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace' font-size="11.5" fill="#8be9fd">Next.js</text><rect x="99.0" y="128" width="69.0" height="22" rx="11" fill="#44475a"/><text x="133.5" y="143" text-anchor="middle" font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace' font-size="11.5" fill="#8be9fd">Drizzle</text><rect x="174.0" y="128" width="90.0" height="22" rx="11" fill="#44475a"/><text x="219.0" y="143" text-anchor="middle" font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace' font-size="11.5" fill="#8be9fd">PostgreSQL</text>
