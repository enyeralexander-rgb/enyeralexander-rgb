<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 196" width="420" height="196" role="img" aria-label="Sal Celestial: Premium salt brand site with a no-code admin panel to edit content and media. Live">
  <title>Sal Celestial</title>
  <style>
    .corre{animation:corre 7s linear infinite;animation-delay:-0.0s}
    @keyframes corre{to{stroke-dashoffset:-1000}}
    .brillo{animation:brillo 7s ease-in-out infinite;animation-delay:2.0s}
    @keyframes brillo{0%{transform:translateX(0)}40%,100%{transform:translateX(680px)}}
    .anillo{transform-box:fill-box;transform-origin:center;animation:anillo 2s ease-out infinite}
    @keyframes anillo{0%{transform:scale(1);opacity:.9}100%{transform:scale(3.2);opacity:0}}
    .tipo{animation:tipo 5s steps(15) infinite}
    @keyframes tipo{0%,50%{width:150px}62%{width:0}90%,100%{width:150px}}
    .cursor{animation:cursor 5s steps(15) infinite}
    @keyframes cursor{0%,50%{transform:translateX(136px)}62%{transform:translateX(0)}90%,100%{transform:translateX(136px)}}
    .parpadeo{animation:parpadeo 1s steps(1) infinite}
    @keyframes parpadeo{50%{opacity:0}}
    .marcha{animation:marcha 1s linear infinite}
    @keyframes marcha{to{transform:translateX(24px)}}
    .pasa{animation:pasa 3s linear infinite}
    @keyframes pasa{0%{transform:translateX(0) skewX(-20deg)}100%{transform:translateX(500px) skewX(-20deg)}}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
  <defs>
    <clipPath id="marco"><rect x="1" y="1" width="418" height="194" rx="12"/></clipPath>
    <linearGradient id="luz" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".07"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <linearGradient id="lleno" x1="0" x2="1"><stop offset="0" stop-color="#8be9fd"/><stop offset="1" stop-color="#bd93f9"/></linearGradient>
  </defs>
  <g>
    <rect x="1" y="1" width="418" height="194" rx="12" fill="#282a36" stroke="#44475a" stroke-width="1.5"/>
    <rect x="1" y="1" width="418" height="30" rx="12" fill="#1e1f29"/>
    <rect x="1" y="20" width="418" height="11" fill="#1e1f29"/>
    <circle cx="22" cy="17" r="4.5" fill="#ff5555"/><circle cx="38" cy="17" r="4.5" fill="#f1fa8c"/><circle cx="54" cy="17" r="4.5" fill="#50fa7b"/>
    <text x="72" y="21" font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace' font-size="11" fill="#6272a4">~/projects/sal-celestial</text>
    <text x="24" y="62" font-family='-apple-system,"Segoe UI",Helvetica,Arial,sans-serif' font-size="21" font-weight="800" fill="#f8f8f2">Sal Celestial</text>
    <rect x="24" y="70" width="34" height="3" rx="1.5" fill="#bd93f9"/>
    <text x="24" y="96" font-family='-apple-system,"Segoe UI",Helvetica,Arial,sans-serif' font-size="14.5" fill="#d6d8e8">Premium salt brand site with a no-code admin</text><text x="24" y="116" font-family='-apple-system,"Segoe UI",Helvetica,Arial,sans-serif' font-size="14.5" fill="#d6d8e8">panel to edit content and media.</text>
    <rect x="24.0" y="128" width="69.0" height="22" rx="11" fill="#44475a"/><text x="58.5" y="143" text-anchor="middle" font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace' font-size="11.5" fill="#8be9fd">Next.js</text><rect x="99.0" y="128" width="90.0" height="22" rx="11" fill="#44475a"/><text x="144.0" y="143" text-anchor="middle" font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace' font-size="11.5" fill="#8be9fd">TypeScript</text><rect x="195.0" y="128" width="90.0" height="22" rx="11" fill="#44475a"/><text x="240.0" y="143" text-anchor="middle" font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace' font-size="11.5" fill="#8be9fd">PostgreSQL</text>
    <circle cx="31" cy="170" r="4.5" fill="#50fa7b"/><circle class="anillo" cx="31" cy="170" r="4.5" fill="none" stroke="#50fa7b" stroke-width="1.5"/><text x="44" y="175" font-family='-apple-system,"Segoe UI",Helvetica,Arial,sans-serif' font-size="13" font-weight="700" letter-spacing="1.6" fill="#50fa7b">LIVE</text><text x="396" y="175" text-anchor="end" font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace' font-size="13" fill="#8be9fd">salcelestialve.com ↗</text>
    
    <g clip-path="url(#marco)"><g class="brillo"><rect x="-140" y="0" width="90" height="196" fill="url(#luz)" transform="skewX(-20)"/></g></g>
    <rect class="corre" x="1.5" y="1.5" width="417" height="193" rx="12" fill="none" stroke="#50fa7b" stroke-width="1.8" pathLength="1000" stroke-dasharray="90 910" stroke-linecap="round" opacity=".9"/>
  </g>
</svg>
